[package]
name = "libcosmic-gtk-appearance"
version = "0.1.0"
edition = "2021"
description = "GIO module that makes GTK3 and GTK4 windows follow the COSMIC desktop appearance settings"
license = "LGPL-3.0-or-later"

[lib]
name = "cosmic_gtk_appearance"
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
